name: Milestone 1 checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: funda_test_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install uv==0.13.6
      - run: uv sync --locked --extra dev
      - run: uv run --locked ruff format --check app tests
      - run: uv run --locked ruff check app tests
      - run: uv run --locked mypy app
      - run: uv run --locked pytest -q
      - run: uv run --locked pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:test-only@localhost:5432/funda_test_ci
      - run: uv run --locked pip-audit --local --skip-editable
      - run: uv run --locked python ../scripts/scan_secrets.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install uv==0.13.6
      - run: uv sync --locked --extra dev
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check && npm run lint && npm run build && npm audit
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: python scripts/scan_secrets.py --assets frontend/dist
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
