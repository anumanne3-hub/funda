name: RAG ingestion
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Durable ingestion job UUID
        required: true
        type: string
  schedule:
    - cron: '0 */5 * * *'
permissions:
  contents: read
concurrency:
  group: rag-ingest-${{ github.event_name == 'schedule' && 'reconcile' || inputs.job_id }}
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
      RAG_STORAGE_URL: ${{ secrets.RAG_STORAGE_URL }}
      RAG_STORAGE_SERVICE_KEY: ${{ secrets.RAG_STORAGE_SERVICE_KEY }}
      RAG_STORAGE_BUCKET: ${{ vars.RAG_STORAGE_BUCKET || 'rag-private' }}
      RAG_EMBEDDING_API_KEY: ${{ secrets.RAG_EMBEDDING_API_KEY }}
      RAG_ALLOWED_SOURCE_URLS: ${{ vars.RAG_ALLOWED_SOURCE_URLS }}
      RAG_JOB_ID: ${{ inputs.job_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install uv==0.13.6
      - run: uv sync --locked
      - if: github.event_name == 'workflow_dispatch'
        run: uv run --locked python -m app.rag.run_worker "$RAG_JOB_ID"
      - if: github.event_name == 'schedule'
        run: uv run --locked python -m app.rag.recover
      - if: github.event_name == 'schedule' && always()
        run: uv run --locked python -m app.rag.cleanup
