[project]
name = "genai-chatbot-api"
version = "0.1.0"
description = "Production-grade GenAI chatbot API"
requires-python = ">=3.13,<3.15"
dependencies = [
  "alembic==1.17.2",
  "fastapi==0.160.0",
  "httpx==0.28.1",
  "pydantic-settings==2.16.2",
  "psycopg[binary,pool]==3.2.12",
  "sqlalchemy==2.1.6",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.14,<0.15",
  "mypy>=1.19,<2",
  "pip-audit>=2.9,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"] # FastAPI uses Depends(...) as its documented dependency syntax.

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true
files = ["app"]
