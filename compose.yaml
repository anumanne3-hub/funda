services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: genai_chatbot
      POSTGRES_USER: genai
      POSTGRES_PASSWORD: genai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genai -d genai_chatbot"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
