services:
  - type: web
    name: funda-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install uv==0.13.6 && uv sync --locked
    startCommand: uv run --locked uvicorn app.main:app --host 0.0.0.0 --port $PORT --ws-max-size 65536
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.11
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://funda-geni.vercel.app,https://funda-phi.vercel.app
      - key: SESSION_COOKIE_SECURE
        value: 'true'
      - key: SESSION_COOKIE_SAMESITE
        value: none
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.1-flash-lite
      - key: LLM_API_KEY
        sync: false
      - key: LLM_INPUT_USD_PER_MILLION
        value: '0'
      - key: LLM_OUTPUT_USD_PER_MILLION
        value: '0'
      - key: LLM_FREE_TIER
        value: 'true'
      - key: LLM_DAILY_REQUEST_LIMIT
        value: '100'
      - key: LLM_DAILY_BUDGET_USD
        value: '1'
